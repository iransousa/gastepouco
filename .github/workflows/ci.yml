name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://gastemenos:gastemenos@localhost:5432/gastemenos?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-secret-com-mais-de-32-caracteres-aqui
  JWT_REFRESH_SECRET: ci-refresh-secret-com-mais-de-32-caracteres
  USER_HASH_SECRET: ci-user-hash-secret

jobs:
  verificar:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gastemenos
          POSTGRES_PASSWORD: gastemenos
          POSTGRES_DB: gastemenos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gastemenos"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Falha se tokens.css ou o preset saírem de sincronia com tokens.json.
      - name: Tokens em dia com o design system
        run: pnpm --filter @gastemenos/tokens check

      - name: Cliente do Prisma e migrations
        run: |
          pnpm --filter @gastemenos/api exec prisma generate
          pnpm --filter @gastemenos/api exec prisma migrate deploy

      - name: Seed reproduz os números das telas
        run: pnpm --filter @gastemenos/api exec tsx prisma/seed.ts

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Playwright e acessibilidade
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gastemenos/web exec playwright install --with-deps chromium
      - run: pnpm --filter @gastemenos/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
