<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GasteMenos · Ajuda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#E9E6DD;font-family:'Figtree',system-ui,sans-serif;color:#14201A}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-0.02em}
a{color:#0E4D3A}a:hover{color:#0A3A2B}
button,input{font-family:inherit}
input:focus{outline:none;border-color:#0E4D3A !important;box-shadow:0 0 0 4px #E4F5A6}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
:focus-visible{outline:3px solid #6B5BE0;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1420px; position: relative; overflow: hidden; background: #F5F3EC; box-sizing: border-box; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px">

<header style="display: flex; align-items: center; justify-content: space-between">
<a href="Perfil.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2DDD0; color: #14201A; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="font-size: 20px; font-weight: 800">Ajuda</h1>
<span style="width: 44px"></span>
</header>

<section style="display: flex; flex-direction: column; gap: 12px; animation: rise .5s ease both">
<h2 style="font-size: 28px; font-weight: 800; line-height: 1.1">Como podemos ajudar?</h2>
<label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #D8D2C2; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#47524C" style="stroke-width: 2.2; stroke-linecap: round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar na ajuda</span>
<input type="search" placeholder="Ex.: nota não lê, pontos, CPF" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font-size: 15px; color: #14201A">
</label>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; animation: rise .5s .05s ease both">
<sc-for list="{{ topics }}" as="t" hint-placeholder-count="4">
<sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="true" onClick="{{ t.pick }}" style="min-height: 84px; padding: 12px; border-radius: 18px; border: 2px solid #0E4D3A; background: #E4F5A6; color: #14201A; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; text-align: left; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{ t.d }}"></path></svg><span style="font-size: 14px; font-weight: 800">{{ t.label }}</span></button></sc-if>
<sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="false" onClick="{{ t.pick }}" style="min-height: 84px; padding: 12px; border-radius: 18px; border: 2px solid #ECE8DC; background: #FFFFFF; color: #14201A; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; text-align: left; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{ t.d }}"></path></svg><span style="font-size: 14px; font-weight: 700">{{ t.label }}</span></button></sc-if>
</sc-for>
</div>

<section style="display: flex; flex-direction: column; gap: 8px; animation: rise .5s .1s ease both">
<h2 style="font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #47524C; padding-left: 4px">{{ faqTitle }}</h2>
<div style="background: #FFFFFF; border: 1px solid #ECE8DC; border-radius: 20px; overflow: hidden">
<sc-for list="{{ faqs }}" as="f" hint-placeholder-count="4">
<div style="border-bottom: 1px solid #F0EDE4">
<button type="button" aria-expanded="{{ f.expanded }}" onClick="{{ f.toggle }}" style="width: 100%; min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 0; background: transparent; color: #14201A; text-align: left; cursor: pointer">
<span style="flex-grow: 1; font-size: 15px; font-weight: 700; line-height: 1.3">{{ f.q }}</span>
<sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></sc-if>
<sc-if value="{{ f.closed }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></sc-if>
</button>
<sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 0 14px 14px; font-size: 14px; line-height: 1.5; color: #3D4842; animation: open .25s ease-out both">{{ f.a }}</p></sc-if>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px; animation: rise .5s .15s ease both">
<h2 style="font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #47524C; padding-left: 4px">FALE COM A GENTE</h2>
<button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; border: 0; background: #0E4D3A; color: #F5F3EC; text-align: left; cursor: pointer">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #D4F36B; color: #14201A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20.5 5.5 15.8A8 8 0 1 1 21 12z"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Conversar pelo chat</span><span style="font-size: 13px; color: #CFE3D9">Atendimento: [HORÁRIO DE ATENDIMENTO]</span></span>
</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="min-height: 72px; padding: 12px; border-radius: 18px; border: 1px solid #ECE8DC; background: #FFFFFF; color: #14201A; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; cursor: pointer"><span style="font-size: 14px; font-weight: 700">Enviar e-mail</span><span style="font-size: 13px; color: #47524C">[E-MAIL DE SUPORTE]</span></button>
<button type="button" style="min-height: 72px; padding: 12px; border-radius: 18px; border: 1px solid #ECE8DC; background: #FFFFFF; color: #14201A; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; cursor: pointer"><span style="font-size: 14px; font-weight: 700">Reportar um problema</span><span style="font-size: 13px; color: #47524C">Com print da tela</span></button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<div style="background: #FFFFFF; border: 1px solid #ECE8DC; border-radius: 20px; overflow: hidden">
<button type="button" style="width: 100%; display: flex; align-items: center; min-height: 54px; padding: 8px 14px; border: 0; border-bottom: 1px solid #F0EDE4; background: transparent; color: #14201A; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer">Termos de uso</button>
<button type="button" style="width: 100%; display: flex; align-items: center; min-height: 54px; padding: 8px 14px; border: 0; background: transparent; color: #14201A; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer">Política de privacidade</button>
</div>
<span style="text-align: center; font-size: 13px; color: #47524C">GasteMenos · versão 1.0.0</span>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { topic: 'notas', open: 0 };
  }
  renderVals() {
    const T = [
      { id: 'notas', label: 'Ler notas', d: 'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10', title: 'LER NOTAS', faqs: [
        { q: 'A nota não lê. O que faço?', a: 'Limpe a câmera, acenda a lanterna e aproxime até o QR code ficar nítido. Se a nota estiver apagada, toque em “Digitar chave” e informe os 44 números que ficam perto do QR code.' },
        { q: 'Quais notas funcionam?', a: 'Notas fiscais de consumidor (NFC-e) com QR code, de qualquer estado. Cupons sem QR code ainda não são lidos.' },
        { q: 'Posso ler a mesma nota duas vezes?', a: 'Não. Cada nota vale uma vez, para manter o ranking justo. Se outra pessoa já leu a mesma nota, ela vale para quem leu primeiro.' },
        { q: 'O que é o CPF na nota?', a: 'Se você informar seu CPF, podemos importar as notas emitidas no seu nome, sem precisar escanear. É opcional e pode ser removido quando quiser.' }
      ] },
      { id: 'jogo', label: 'Pontos e ranking', d: 'm12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z', title: 'PONTOS E RANKING', faqs: [
        { q: 'Como ganho pontos?', a: 'Cada nota lida vale 60 pontos. Você ganha bônus por mercado novo, por manter a sequência da semana, por confirmar ofertas e por convidar amigos.' },
        { q: 'Como funciona o ranking?', a: 'O ranking zera todo mês. Você pode disputar com amigos ou com a sua região em três categorias: quem mais economizou, quem mais comprou e quem ganhou mais pontos.' },
        { q: 'Como a economia é calculada?', a: 'Comparamos o preço que você pagou em cada item com a média da região na mesma semana.' }
      ] },
      { id: 'precos', label: 'Preços e ofertas', d: 'M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 1 0 0-3', title: 'PREÇOS E OFERTAS', faqs: [
        { q: 'De onde vêm os preços?', a: 'Das notas lidas pela comunidade. Mostramos quantas notas e quantas pessoas sustentam cada preço.' },
        { q: 'O que é uma oferta patrocinada?', a: 'É uma promoção paga por um mercado parceiro. Ela sempre aparece com o selo “Patrocinado” e você pode desligar esse tipo de aviso.' },
        { q: 'O preço estava diferente no mercado', a: 'Preços mudam rápido. Abra a nota e toque em “Algum item veio errado?” para nos avisar.' }
      ] },
      { id: 'conta', label: 'Conta e privacidade', d: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z', title: 'CONTA E PRIVACIDADE', faqs: [
        { q: 'Meus dados de compra são públicos?', a: 'Não. Na base de preços entram só produto, preço, mercado e data, sem seu nome, CPF ou endereço.' },
        { q: 'Qual a diferença entre pausar e encerrar?', a: 'Pausar guarda tudo e esconde você do ranking por um tempo. Encerrar apaga a conta em 30 dias; até lá, você pode voltar atrás.' },
        { q: 'Como baixo meus dados?', a: 'Em Perfil › Privacidade e dados › Baixar meus dados. Enviamos um arquivo com suas notas, listas e perfil.' }
      ] }
    ];
    const cur = T.filter((t) => t.id === this.state.topic)[0];
    const open = this.state.open;
    return {
      topics: T.map((t) => ({ label: t.label, d: t.d, on: t.id === cur.id, off: t.id !== cur.id, pick: () => this.setState({ topic: t.id, open: 0 }) })),
      faqTitle: 'DÚVIDAS SOBRE ' + cur.title,
      faqs: cur.faqs.map((f, i) => ({ q: f.q, a: f.a, open: open === i, closed: open !== i, expanded: open === i ? 'true' : 'false', toggle: () => this.setState({ open: this.state.open === i ? -1 : i }) }))
    };
  }
}
</script>
</body>
</html>
