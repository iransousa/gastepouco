<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GasteMenos · Dados pessoais</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#E9E6DD;font-family:'Figtree',system-ui,sans-serif;color:#14201A}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-0.02em}
a{color:#0E4D3A}a:hover{color:#0A3A2B}
button,input{font-family:inherit}
input:focus{outline:none;border-color:#0E4D3A !important;box-shadow:0 0 0 4px #E4F5A6}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translateY(-20px)}15%,85%{opacity:1;transform:none}100%{opacity:1}}
:focus-visible{outline:3px solid #6B5BE0;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1040px; position: relative; overflow: hidden; background: #F5F3EC; box-sizing: border-box; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px">

<sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}"><div role="status" style="position: absolute; left: 20px; right: 20px; top: 16px; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 16px; background: #0E4D3A; color: #F5F3EC; font-size: 14px; font-weight: 700; box-shadow: 0 12px 26px rgba(14,77,58,.3); animation: toast .5s ease-out both"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4F36B" style="stroke-width: 3; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Dados atualizados</div></sc-if>

<header style="display: flex; align-items: center; justify-content: space-between">
<a href="Perfil.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2DDD0; color: #14201A; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="font-size: 20px; font-weight: 800">Dados pessoais</h1>
<span style="width: 44px"></span>
</header>

<div style="display: flex; align-items: center; gap: 16px">
<span style="width: 72px; height: 72px; border-radius: 24px; background: #ECE8FF; color: #3F31B0; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; flex-shrink: 0">CA</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #14201A; color: #F5F3EC; font-size: 14px; font-weight: 700; cursor: pointer">Trocar foto</button>
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D8D2C2; background: #FFFFFF; color: #14201A; font-size: 14px; font-weight: 700; cursor: pointer">Remover</button>
</div>
</div>

<form style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Nome completo
<input type="text" value="{{ f.nome }}" onChange="{{ h.nome }}" autocomplete="name" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Nome no ranking
<input type="text" value="{{ f.apelido }}" onChange="{{ h.apelido }}" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
<span style="font-size: 13px; font-weight: 500; color: #47524C">É assim que amigos e a região veem você.</span>
</label>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700">E-mail<span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; color: #0E4D3A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 3; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Verificado</span></span>
<div style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 6px 0 16px; border-radius: 14px; background: #EFEDE5; border: 1.5px solid #E2DDD0; box-sizing: border-box">
<span style="flex-grow: 1; font-size: 16px; color: #3D4842">camila.alves@email.com</span>
<a href="VerificarEmail.dc.html" style="height: 44px; padding: 0 12px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; font-size: 13px; font-weight: 700; text-decoration: none">Alterar</a>
</div>
<span style="font-size: 13px; font-weight: 500; color: #47524C">Para trocar, enviamos um código ao novo e-mail.</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Celular <span style="font-weight: 500; color: #47524C">(opcional)</span>
<input type="tel" value="{{ f.cel }}" onChange="{{ h.cel }}" autocomplete="tel" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">CEP de compras
<input type="text" inputmode="numeric" value="{{ f.cep }}" onChange="{{ h.cep }}" autocomplete="postal-code" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
<span style="font-size: 13px; font-weight: 500; color: #47524C">Asa Norte, Brasília. Define os preços e ofertas que você vê.</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">CPF na nota <span style="font-weight: 500; color: #47524C">(opcional)</span>
<input type="text" inputmode="numeric" placeholder="000.000.000-00" value="{{ f.cpf }}" onChange="{{ h.cpf }}" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
<span style="font-size: 13px; font-weight: 500; line-height: 1.4; color: #47524C">Com o CPF, podemos importar as notas emitidas no seu nome, sem precisar escanear.</span>
</label>
</form>

<div style="margin-top: auto">
<sc-if value="{{ dirty }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ save }}" style="width: 100%; height: 56px; border-radius: 18px; border: 0; background: #0E4D3A; color: #F5F3EC; font-size: 16px; font-weight: 700; cursor: pointer">Salvar alterações</button></sc-if>
<sc-if value="{{ clean }}" hint-placeholder-val="{{ true }}"><button type="button" disabled style="width: 100%; height: 56px; border-radius: 18px; border: 0; background: #D8D2C2; color: #47524C; font-size: 16px; font-weight: 700">Nenhuma alteração</button></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: { nome: 'Camila Alves', apelido: 'Camila A.', cel: '(61) 9 0000-0000', cep: '70000-000', cpf: '' }, dirty: false, saved: false };
  }
  renderVals() {
    const keys = ['nome', 'apelido', 'cel', 'cep', 'cpf'];
    const h = {};
    keys.forEach((k) => {
      h[k] = (e) => {
        const f = Object.assign({}, this.state.f);
        f[k] = e.target.value;
        this.setState({ f: f, dirty: true, saved: false });
      };
    });
    return {
      f: this.state.f,
      h: h,
      dirty: this.state.dirty,
      clean: !this.state.dirty,
      saved: this.state.saved,
      save: () => this.setState({ dirty: false, saved: true })
    };
  }
}
</script>
</body>
</html>
