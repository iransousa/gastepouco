<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GasteMenos · Criar conta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#E9E6DD;font-family:'Figtree',system-ui,sans-serif;color:#14201A}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-0.02em}
a{color:#0E4D3A}a:hover{color:#0A3A2B}
button,input{font-family:inherit}
input:focus{outline:none;border-color:#0E4D3A !important;box-shadow:0 0 0 4px #E4F5A6}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes tick{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
:focus-visible{outline:3px solid #6B5BE0;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 940px; position: relative; overflow: hidden; background: #F5F3EC; box-sizing: border-box; display: flex; flex-direction: column; padding: 16px 24px 28px; gap: 18px">

<header style="display: flex; align-items: center; justify-content: space-between">
<a href="Onboarding3.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2DDD0; color: #14201A; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span style="display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; background: #ECE8FF; color: #3F31B0; font-size: 13px; font-weight: 800"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"></path></svg>+50 pontos de boas-vindas</span>
</header>

<section style="display: flex; flex-direction: column; gap: 6px; animation: rise .5s ease both">
<h1 style="font-size: 32px; font-weight: 800; line-height: 1.05">Crie sua conta</h1>
<p style="margin: 0; font-size: 15px; color: #4A554F">Leva menos de um minuto.</p>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; animation: rise .5s .05s ease both">
<a href="GoogleLogin.dc.html" style="height: 52px; border-radius: 16px; border: 1.5px solid #D8D2C2; background: #FFFFFF; color: #14201A; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-decoration: none; box-sizing: border-box">Google</a>
<a href="PerfilConsumo.dc.html" style="height: 52px; border-radius: 16px; border: 1.5px solid #D8D2C2; background: #FFFFFF; color: #14201A; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-decoration: none; box-sizing: border-box">Apple</a>
</div>

<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #47524C"><span style="flex-grow: 1; height: 1px; background: #D8D2C2"></span>ou com e-mail<span style="flex-grow: 1; height: 1px; background: #D8D2C2"></span></div>

<form style="display: flex; flex-direction: column; gap: 14px; animation: rise .5s .1s ease both">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Como podemos te chamar?
<input type="text" placeholder="Seu nome" autocomplete="given-name" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">E-mail
<input type="email" placeholder="voce@email.com" autocomplete="email" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Senha
<input type="password" value="economia2026" autocomplete="new-password" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
<span style="display: flex; gap: 4px; margin-top: 2px" aria-hidden="true"><span style="flex: 1 1 0; height: 5px; border-radius: 3px; background: #0E4D3A"></span><span style="flex: 1 1 0; height: 5px; border-radius: 3px; background: #0E4D3A"></span><span style="flex: 1 1 0; height: 5px; border-radius: 3px; background: #0E4D3A"></span><span style="flex: 1 1 0; height: 5px; border-radius: 3px; background: #D8D2C2"></span></span>
<span style="font-size: 13px; font-weight: 600; color: #0E4D3A">Senha boa. Um símbolo deixaria mais forte.</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">CEP de onde você faz compras
<span style="display: flex; gap: 8px">
<input type="text" inputmode="numeric" placeholder="00000-000" autocomplete="postal-code" style="flex-grow: 1; min-width: 0; height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
<button type="button" style="height: 52px; padding: 0 14px; border-radius: 14px; border: 0; background: #ECE8FF; color: #3F31B0; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>Usar local</button>
</span>
<span style="font-size: 13px; font-weight: 500; color: #47524C">Usamos para mostrar preços e ofertas da sua região.</span>
</label>

<button type="button" role="checkbox" aria-checked="{{ agreedStr }}" onClick="{{ toggleAgree }}" style="display: flex; align-items: flex-start; gap: 12px; padding: 4px 0; border: 0; background: transparent; text-align: left; cursor: pointer; font-size: 13px; line-height: 1.45; color: #4A554F">
<sc-if value="{{ agreed }}" hint-placeholder-val="{{ true }}"><span style="width: 26px; height: 26px; border-radius: 8px; background: #0E4D3A; color: #D4F36B; display: flex; align-items: center; justify-content: center; flex-shrink: 0; animation: tick .3s ease-out both"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
<sc-if value="{{ notAgreed }}" hint-placeholder-val="{{ false }}"><span style="width: 26px; height: 26px; border-radius: 8px; border: 2px solid #A9A290; box-sizing: border-box; flex-shrink: 0"></span></sc-if>
<span>Li e aceito os <strong style="color: #0E4D3A">Termos de uso</strong> e a <strong style="color: #0E4D3A">Política de privacidade</strong>. Minhas notas ajudam a comunidade de forma anônima.</span>
</button>
</form>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{ agreed }}" hint-placeholder-val="{{ true }}"><a href="VerificarEmail.dc.html" style="height: 56px; border-radius: 18px; background: #0E4D3A; color: #F5F3EC; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">Criar conta</a></sc-if>
<sc-if value="{{ notAgreed }}" hint-placeholder-val="{{ false }}"><button type="button" disabled style="height: 56px; border-radius: 18px; border: 0; background: #D8D2C2; color: #47524C; font-size: 16px; font-weight: 700">Aceite os termos para continuar</button></sc-if>
<p style="margin: 0; text-align: center; font-size: 15px; color: #4A554F">Já tem conta? <a href="Entrar.dc.html" style="font-weight: 800">Entrar</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { agreed: true };
  }
  renderVals() {
    const agreed = this.state.agreed;
    return {
      agreed: agreed,
      notAgreed: !agreed,
      agreedStr: agreed ? 'true' : 'false',
      toggleAgree: () => this.setState({ agreed: !this.state.agreed })
    };
  }
}
</script>
</body>
</html>
