<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GasteMenos · Alterar senha</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#E9E6DD;font-family:'Figtree',system-ui,sans-serif;color:#14201A}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-0.02em}
a{color:#0E4D3A}a:hover{color:#0A3A2B}
button,input{font-family:inherit}
input:focus{outline:none;border-color:#0E4D3A !important;box-shadow:0 0 0 4px #E4F5A6}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes tick{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
:focus-visible{outline:3px solid #6B5BE0;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F3EC; box-sizing: border-box; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px">

<header style="display: flex; align-items: center; justify-content: space-between">
<a href="Seguranca.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2DDD0; color: #14201A; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="font-size: 20px; font-weight: 800">Alterar senha</h1>
<span style="width: 44px"></span>
</header>

<sc-if value="{{ editing }}" hint-placeholder-val="{{ true }}">
<form style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Senha atual
<input type="password" value="{{ cur }}" onChange="{{ onCur }}" autocomplete="current-password" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
</label>
<a href="RecuperarSenha.dc.html" style="align-self: flex-end; margin-top: -6px; font-size: 13px; font-weight: 700; text-decoration: none; padding: 4px 0">Não lembro a senha atual</a>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Nova senha
<input type="password" value="{{ pw }}" onChange="{{ onPw }}" autocomplete="new-password" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
</label>
<ul aria-label="Requisitos da senha" style="list-style: none; margin: 0; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECE8DC; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ rules }}" as="r" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 10px; font-size: 14px">
<sc-if value="{{ r.ok }}" hint-placeholder-val="{{ false }}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #0E4D3A; color: #D4F36B; display: flex; align-items: center; justify-content: center; flex-shrink: 0; animation: tick .3s ease-out both"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="font-weight: 600">{{ r.label }}</span></sc-if>
<sc-if value="{{ r.no }}" hint-placeholder-val="{{ true }}"><span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #B9B2A0; box-sizing: border-box; flex-shrink: 0"></span><span style="color: #47524C">{{ r.label }}</span></sc-if>
</li>
</sc-for>
</ul>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Repita a nova senha
<input type="password" value="{{ pw2 }}" onChange="{{ onPw2 }}" autocomplete="new-password" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D8D2C2; background: #FFFFFF; font-size: 16px; color: #14201A; box-sizing: border-box">
<sc-if value="{{ mismatch }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 700; color: #B4410F">As senhas não são iguais.</span></sc-if>
</label>
</form>
<div style="margin-top: auto">
<sc-if value="{{ valid }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ save }}" style="width: 100%; height: 56px; border-radius: 18px; border: 0; background: #0E4D3A; color: #F5F3EC; font-size: 16px; font-weight: 700; cursor: pointer">Salvar nova senha</button></sc-if>
<sc-if value="{{ invalid }}" hint-placeholder-val="{{ true }}"><button type="button" disabled style="width: 100%; height: 56px; border-radius: 18px; border: 0; background: #D8D2C2; color: #47524C; font-size: 16px; font-weight: 700">Salvar nova senha</button></sc-if>
</div>
</sc-if>

<sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="align-self: center; margin-top: 60px; width: 110px; height: 110px; border-radius: 50%; background: #0E4D3A; color: #D4F36B; display: flex; align-items: center; justify-content: center; animation: pop .6s ease-out both"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M20 6 9 17l-5-5"></path></svg></div>
<section style="display: flex; flex-direction: column; gap: 8px; text-align: center">
<h2 style="font-size: 28px; font-weight: 800">Senha alterada</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #4A554F">Mandamos um aviso para camila.alves@email.com. Se não foi você, fale com a gente.</p>
</section>
<a href="Perfil.dc.html" style="margin-top: auto; height: 56px; border-radius: 18px; background: #0E4D3A; color: #F5F3EC; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">Voltar ao perfil</a>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cur: '', pw: '', pw2: '', done: false };
  }
  renderVals() {
    const pw = this.state.pw;
    const pw2 = this.state.pw2;
    const tests = [
      { label: 'Pelo menos 8 caracteres', ok: pw.length >= 8 },
      { label: 'Um número', ok: /[0-9]/.test(pw) },
      { label: 'Uma letra maiúscula', ok: /[A-Z]/.test(pw) },
      { label: 'Diferente da senha atual', ok: pw.length > 0 && pw !== this.state.cur }
    ];
    const allOk = tests.every((t) => t.ok);
    const match = pw2.length > 0 && pw2 === pw;
    const valid = allOk && match && this.state.cur.length > 0;
    const set = (k) => (e) => { const o = {}; o[k] = e.target.value; this.setState(o); };
    return {
      cur: this.state.cur, pw: pw, pw2: pw2,
      onCur: set('cur'), onPw: set('pw'), onPw2: set('pw2'),
      rules: tests.map((t) => ({ label: t.label, ok: t.ok, no: !t.ok })),
      mismatch: pw2.length > 0 && pw2 !== pw,
      valid: valid, invalid: !valid,
      editing: !this.state.done, done: this.state.done,
      save: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
