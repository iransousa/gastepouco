services:
  db:
    image: postgres:16-alpine
    container_name: gastemenos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastemenos
      POSTGRES_PASSWORD: gastemenos
      POSTGRES_DB: gastemenos
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gastemenos -d gastemenos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gastemenos-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  redis-data:
